services:

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend

  warehouse_db:
    image: postgres:15
    environment:
      TZ: Europe/Moscow
      POSTGRES_INITDB_ARGS: --timezone=Europe/Moscow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: NjFlZDNmOTM3M2JmMzZhOTE3MTA3NTk5N2RmMDNhMzUyNTZjMzEyNDUyMGE3NDll
      POSTGRES_DB: warehouse
    command: postgres -c timezone=Europe/Moscow
    ports:
      - "8888:5432"
    volumes:
      - warehouse_db_data:/var/lib/postgresql/data
    networks:
      - backend

  server:
    build: ./backend
    depends_on:
      - warehouse_db
    env_file:
      - ./backend/.env
    volumes:
      - product_images:/app/uploads/products
    networks:
      - backend

  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - server
    networks:
      - backend

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - server
    networks:
      - backend

volumes:
  warehouse_db_data:
  pgadmin_data:
  product_images:

networks:
  backend:
    driver: bridge
