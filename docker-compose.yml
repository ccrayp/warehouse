services:

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend

  warehouse_db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: warehouse
    ports:
      - "8888:5432"
    volumes:
      - warehouse_db_data:/var/lib/postgresql/data
    networks:
      - backend

  server:
    build: ./backend
    # ports:
    #   - "8081:8080"
    depends_on:
      - warehouse_db
    env_file:
      - ./backend/.env
    volumes:
      - product_images:/app/uploads/products
    networks:
      - backend

  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - server
    networks:
      - backend

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - server
    networks:
      - backend

volumes:
  warehouse_db_data:
  pgadmin_data:
  product_images:

networks:
  backend:
    driver: bridge
