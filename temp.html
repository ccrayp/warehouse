<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список товаров</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            padding: 20px;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .product-card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            width: 200px;
            padding: 10px;
            text-align: center;
        }
        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .product-card h3 {
            font-size: 16px;
            margin: 0;
        }
    </style>
</head>
<body>
    <h1>Товары</h1>
    <div class="products" id="products"></div>

    <script>
        const apiUrl = "http://localhost:8080/api/products?limit=100&offset=0";

        async function loadProducts() {
            try {
                const response = await fetch(apiUrl, {
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6InZhbGVudGluX2FkbWluIiwicm9sZSI6ImFkbWluIiwiZXhwIjoxNzY1MDEyNjMwfQ.cuBYE7xbyotlwlQcg7RXCErN_b5uHag27lFNLo0ftW0"
                    }
                });
                const data = await response.json();

                if (!data.success) {
                    console.error("Ошибка API:", data.message);
                    return;
                }

                const container = document.getElementById("products");
                container.innerHTML = "";

                data.data.products.forEach(product => {
                    const imgUrl = product.image_url.startsWith("/")
                        ? "http://localhost:8080" + product.image_url
                        : product.image_url;

                    const card = document.createElement("div");
                    card.className = "product-card";

                    card.innerHTML = `
                        <img src="${imgUrl}" alt="${product.name}" />
                        <h3>${product.name}</h3>
                    `;

                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Ошибка загрузки товаров:", err);
            }
        }

        loadProducts();
    </script>
</body>
</html>
